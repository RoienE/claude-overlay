[package]
name = "claude-overlay"
version = "0.9.4"
description = "Always-on-top Claude usage overlay"
authors = []
edition = "2021"
rust-version = "1.77"

[lib]
name = "claude_overlay_lib"
crate-type = ["rlib"]

[[bin]]
name = "claude-overlay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = { version = "2" }
tauri-plugin-shell = { version = "2" }
tauri-plugin-updater = { version = "2" }
tauri-plugin-process = { version = "2" }
tauri-plugin-dialog  = { version = "2" }
tauri-plugin-log = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha1 = "0.10"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "wtsapi32", "sysinfoapi", "dpapi", "wincrypt", "winbase"] }

[target.'cfg(target_os = "macos")'.dependencies]
# OSX_10_15 enables kSecUseDataProtectionKeychain, which the data-protection
# keychain read path needs; without it that query silently hits the legacy store.
security-framework = { version = "3", features = ["OSX_10_15"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
